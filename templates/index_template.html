<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio By AI {Longevity Edition}</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 4px solid #2c3e50;
            border-top: 4px solid #2c3e50;
            margin-bottom: 30px;
            background: #fff;
        }
        .logo-container {
            flex: 1;
        }
        .logo {
            max-height: 100px;
            padding-left: 20px;
        }
        .title-container {
            flex: 2;
            text-align: center;
        }
        .title-container h1 {
            font-size: 3em;
            color: #2c3e50;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .title-container .edition {
            font-weight: bold; 
            color: #34495e; 
            margin-top: 5px;
            font-size: 1.4em;
        }
        .date-container {
            flex: 1;
            text-align: right;
            padding-right: 20px;
            color: #7f8c8d;
            font-weight: bold;
        }
        .newspaper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }
        .story-card {
            background: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .story-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }
        .story-card h2 {
            font-size: 1.8em;
            margin-top: 0;
            color: #2c3e50;
            line-height: 1.2;
        }
        .story-card h2 a {
            text-decoration: none;
            color: inherit;
        }
        .story-card h2 a:hover {
            text-decoration: underline;
        }
        .snippet {
            font-size: 1em;
            color: #555;
            margin-bottom: 15px;
            flex-grow: 1;
        }
        .read-more {
            display: inline-block;
            font-weight: bold;
            color: #3498db;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9em;
            margin-top: auto;
        }
        .read-more:hover {
            color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <img src="{{ root_path }}/logo.jpg" alt="Bio By AI Logo" class="logo">
        </div>
        <div class="title-container">
            <h1>Bio By AI</h1>
            <div class="edition">{Longevity Edition}</div>
        </div>
        <div class="date-container">
            <div>{{ date }}</div>
            {% if editions %}
            <div style="margin-top: 10px;">
                <select onchange="if (this.value) window.location.href=this.value;" style="padding: 5px; font-family: 'Georgia', serif; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="">Previous Editions...</option>
                    {% for edition in editions %}
                        <option value="{{ root_path }}/editions/{{ edition }}/index.html">{{ edition }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
        </div>
    </div>

    <div class="newspaper-grid">
        {% for paper in papers %}
        {% if paper.story %}
        <div class="story-card">
            {% if paper.image_path %}
            <a href="{{ paper.slug }}">
                <!-- Ensure correct pathing when on the same directory level -->
                <img src="{{ root_path }}/{{ paper.image_path }}" alt="Infographic" class="story-img">
            </a>
            {% endif %}
            <h2><a href="{{ paper.slug }}">{{ paper.story.headline }}</a></h2>
            <div class="snippet">
                <strong>Why it matters:</strong> {{ paper.story.why_it_matters }}
            </div>
            <a href="{{ paper.slug }}" class="read-more">Read Full Story →</a>
        </div>
        {% endif %}
        {% endfor %}
    </div>
</body>
</html>
